name: Ateerat public catalog sync

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Arabic font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Sync Ateerat catalog
        run: python catalog.py --all --max-products 200 --delay 1 --out data

      - name: Generate 7 review-only marketing drafts
        run: python marketing_drafts.py --catalog data/catalog.json --output-dir marketing --count 7

      - name: Generate product image cards
        run: python marketing_cards.py --catalog data/catalog.json --drafts marketing/drafts.json --out marketing/cards

      - name: Commit approved-source catalog and review-only designs
        shell: bash
        run: |
          git config user.name "ateerat-catalog-bot"
          git config user.email "ateerat-catalog-bot@users.noreply.github.com"
          git add data/catalog.json data/catalog.csv data/changes.json marketing/drafts.json marketing/drafts.csv marketing/cards marketing/cards_manifest.json marketing/preview.html
          if ! git diff --cached --quiet; then
            git commit -m "Update Ateerat catalog and review-only marketing assets"
            git push
          fi
