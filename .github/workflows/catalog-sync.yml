
name: Ateerat public catalog sync

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Sync Ateerat products
        run: |
          python catalog.py --all --max-products 200 --delay 1 --out data

      - name: Save catalog changes
        shell: bash
        run: |
          git config user.name "ateerat-catalog-bot"
          git config user.email "ateerat-catalog-bot@users.noreply.github.com"
          git add data/catalog.json data/catalog.csv data/changes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Ateerat catalog"
            git push
          fi
